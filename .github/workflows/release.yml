name: Release

# Pushing a tag publishes GitHub Release assets. The tag must be the
# packaging version from upstream.json, for example v0.4.11-1.
# workflow_dispatch builds the same artifacts and does not publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the tag to match upstream.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          expected=$(node --input-type=module -e "import { loadUpstream } from './scripts/packaging.mjs'; const upstream = await loadUpstream(); process.stdout.write(upstream.tag)")
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match upstream.json ($expected)"
            exit 1
          fi
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross
      - name: Test
        run: npm test
      - name: Build ${{ matrix.arch }}
        run: node scripts/build.mjs --arch ${{ matrix.arch }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mingle-cli-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: mingle-cli-*
          merge-multiple: true
          path: artifacts
      - name: Checksums and release notes
        run: |
          set -eu
          cd artifacts
          sha256sum $(ls -1 mingle-cli-* | sort) > SHA256SUMS
          cd ..
          node scripts/release-notes.mjs > notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "$tag" --notes-file notes.md
          fi
